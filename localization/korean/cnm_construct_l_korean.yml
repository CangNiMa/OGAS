l_korean:

je_cnm_construct_manager: "OGAS 자동 건설"
#je_cnm_construct_manager_status_desc: "$construction_unit_price$\n$construct_power_queue_price$\n$construct_power_cost$\n$OGAS_building_unit_config$\n$OGAS_building_queue_config$"
je_cnm_construct_manager_status_desc: "$OGAS_building_unit_config$\n$OGAS_building_queue_config$"
construction_unit_price: "건설력 단가 @money![Scope.GetCountry.MakeScope.ScriptValue('cnm_current_construct_power_unit_price')|D]"
construct_power_queue_price: "대기열당 비용 @money![Scope.GetCountry.MakeScope.ScriptValue('cnm_current_construct_power_queue_price')|D]"
construct_power_cost: "건설 총비용 @money![Scope.GetCountry.MakeScope.ScriptValue('cnm_current_construct_power_cost')|D]"
OGAS_building_unit_config: "회당 건설 수 [Scope.GetCountry.MakeScope.Var('OGAS_building_unit_config').GetValue]"
OGAS_building_queue_config: "건설 대기열 목표 기간 [Scope.GetCountry.MakeScope.Var('OGAS_building_queue_config').GetValue]주"

construct_manager: "+1 최고 수익 건물"
construct_manager_desc: "수익이 가장 높은 건물을 1단계 자동 확장합니다.\n\n추가 설명\n누르면 조건을 충족하는 건물 중 계산상 가중 수익이 가장 높은 건물의 확장 공사를 대기열에 추가합니다. 추가하는 단계 수에는 현재 회당 건설 수 설정이 적용됩니다. 순위에는 건설 비용과 건물별 가중치가 반영되며, 건설 효율 반영 설정을 켜면 해당 보정치도 반영됩니다."

add_best_building_construction_sector: "+1 최적의 건설 부문"
add_best_building_construction_sector_desc: "건설력 단가가 가장 낮은 건설 부문을 1단계 자동 확장합니다.\n\n추가 설명\n누르면 현재 연구된 건설 기술을 기준으로 적합한 기존 건설 부문 한 곳의 1단계 확장 공사를 대기열에 추가합니다. 자동 확장 기능의 켜짐 여부와 별도로 실행하는 일회성 버튼입니다."

active_auto_construct_manager: "[SelectLocalization( EqualTo_CFixedPoint( Scope.GetCountry.MakeScope.Var('cnm_auto_construct_manager').GetValue,'(CFixedPoint)0'), '@simple_box!', '@green_checkmark_box!')]$active_auto_construct_manager_no_icon$"
active_auto_construct_manager_no_icon: "자동 건설"
active_auto_construct_manager_desc: "OGAS가 수익성이 가장 높은 건물로 건설 대기열을 자동으로 채웁니다. 건설이 이루어지지 않으면 건물에 적용된 제한 조건이 너무 많은지 확인하십시오. '$construct_manager$' 버튼으로 빠르게 확인할 수 있습니다.\n이 기능은 기본 게임의 자동 확장과 '$active_auto_railway_manager_no_icon$' 이후에 실행됩니다.\n\n추가 설명\n누르면 자동 건설을 켜거나 끕니다. 켜 두면 매주 조건에 맞는 건물을 찾아 건설 대기열이 목표 기간에 도달할 때까지 확장 공사를 추가합니다. 버튼 옆 체크 표시로 활성화 여부를 확인할 수 있습니다."

active_auto_railway_manager: "[SelectLocalization( EqualTo_CFixedPoint( Scope.GetCountry.MakeScope.Var('cnm_auto_railway_manager').GetValue,'(CFixedPoint)0'), '@simple_box!', '@green_checkmark_box!')]$active_auto_railway_manager_no_icon$"
active_auto_railway_manager_no_icon: "철도 자동 건설"
active_auto_railway_manager_desc: "철도를 자동으로 건설하여 기반시설을 확충합니다.\n기본 게임의 자동 확장 이후, '$je_cnm_construct_manager$' 이전에 실행됩니다.\n이 기능의 철도 건설은 '$je_cnm_construct_manager$'의 수익성에 따른 철도 건설과 구분됩니다.\n\n추가 설명\n누르면 기반시설 확보용 철도 자동 관리를 켜거나 끕니다. 켜 두면 매주 기반시설 여유가 0 이하인 주를 확인하고, 사용 가능한 상위 철도 생산 방식으로의 전환을 우선 시도한 뒤 필요한 철도 공사를 추가합니다."

active_auto_construction_sector_manager: "[SelectLocalization( EqualTo_CFixedPoint( Scope.GetCountry.MakeScope.Var('cnm_auto_construction_sector_manager').GetValue,'(CFixedPoint)0'), '@simple_box!', '@green_checkmark_box!')]$active_auto_construction_sector_manager_no_icon$"
active_auto_construction_sector_manager_no_icon: "건설 부문 자동 확장"
active_auto_construction_sector_manager_desc: "재정 수지가 충분하고 낭비되는 건설력이 없으면 건설 부문을 자동으로 건설합니다.\n\n추가 설명\n누르면 건설 부문 자동 확장을 켜거나 끕니다. 켜 두면 매주 낭비되는 건설력이 없고 순수입이 건설 부문 1단계 비용보다 클 때 조건에 맞는 건설 부문 공사를 추가합니다."


add_best_contruction: "+1 최적의 건설 부문"
add_best_contruction_desc: "건설력 단가가 가장 낮은 건설 부문을 1단계 건설합니다."

active_ban_construct_power_low: "[SelectLocalization( EqualTo_CFixedPoint( Scope.GetCountry.MakeScope.Var('cnm_construct_rule_ban_construct_power_low').GetValue,'(CFixedPoint)0'), '@simple_box!', '@green_checkmark_box!')]건설 효율이 낮은 주 제외"
active_ban_construct_power_low_desc: "$je_cnm_construct_manager$이 $state_construction_mult$ 수치가 0 미만인 주를 건설 대상에서 제외합니다.\n\n추가 설명\n누르면 건설 효율 제한을 켜거나 끕니다. 켜면 해당 보정치가 0 이상인 주만 후보로 남습니다. 다른 건설 조건도 함께 충족해야 합니다."
active_ban_no_incorporated: "[SelectLocalization( EqualTo_CFixedPoint( Scope.GetCountry.MakeScope.Var('cnm_construct_rule_ban_no_incorporated').GetValue,'(CFixedPoint)0'), '@simple_box!', '@green_checkmark_box!')]편입된 주에서만 건설"
active_ban_no_incorporated_desc: "$je_cnm_construct_manager$이 편입된 주에서만 건설합니다.\n\n추가 설명\n누르면 편입 여부에 따른 건설 제한을 켜거나 끕니다. 켜면 OGAS의 건설 후보가 편입된 주로 제한됩니다."

active_ban_unemployed_low: "[SelectLocalization( EqualTo_CFixedPoint( Scope.GetCountry.MakeScope.Var('cnm_construct_rule_ban_unemployed_low').GetValue,'(CFixedPoint)0'), '@simple_box!', '@green_checkmark_box!')]실업자 감소"
active_ban_unemployed_low_desc: "$je_cnm_construct_manager$이 실업자가 5,000명을 초과하는 주에서만 건설합니다.\n\n추가 설명\n누르면 실업자 수에 따른 건설 제한을 켜거나 끕니다. 켜면 실업자가 5,000명을 초과하는 주가 건설 후보로 남고, 실제 일자리 증가는 건설 완료와 고용을 통해 이루어집니다."
active_ban_available_workers_low: "[SelectLocalization( EqualTo_CFixedPoint( Scope.GetCountry.MakeScope.Var('cnm_construct_rule_ban_available_workers_low').GetValue,'(CFixedPoint)0'), '@simple_box!', '@green_checkmark_box!')]소작농 감소"
active_ban_available_workers_low_desc: "$je_cnm_construct_manager$이 실업자와 소작농 수의 합계가 5,000명을 초과하는 주에서만 건설합니다.\n\n추가 설명\n누르면 가용 노동력에 따른 건설 제한을 켜거나 끕니다. 실제 계산에는 실업자와 자급 건물의 노동자 수 합계를 사용하며, 그 합계가 5,000명을 초과해야 합니다."
active_use_state_construction_mult: "[SelectLocalization( EqualTo_CFixedPoint( Scope.GetCountry.MakeScope.Var('cnm_rule_use_state_construction_mult').GetValue,'(CFixedPoint)0'), '@simple_box!', '@green_checkmark_box!')]건설 효율을 가중치에 반영"
active_use_state_construction_mult_desc: "건물의 가중치에 $state_construction_mult$ 수치를 반영하여 건설 비용을 절감합니다. 예를 들어 $decree_road_maintenance$ 칙령으로 OGAS가 선택하는 건설 지역에 영향을 줄 수 있습니다.\n\n추가 설명\n누르면 건설 효율의 순위 반영을 켜거나 끕니다. 켜면 건물의 계산상 가중 수익에 주의 건설 효율 보정치를 반영한 배율을 곱합니다. 이 설정은 후보 건물의 선택 순위에 영향을 줍니다."

reset_construct_manager: "$OPTION_DEFAULT$"
reset_construct_manager_desc: "$OPTION_DEFAULT$\n\n추가 설명\n누르면 자동 건설·철도 자동 관리·건설 부문 자동 확장을 끕니다. 건설 효율 제한·가용 노동력 제한·편입된 주 제한·건설 효율 가중치를 켜고, 실업자 제한은 끕니다. 회당 건설 수는 1, 대기열 목표 기간은 16주로 되돌립니다."

OGAS_building_unit_add: "회당 건설 수 +1 @arrow_up!"
OGAS_building_unit_add_desc: "\n\n추가 설명\n누르면 회당 건설 수가 1 증가합니다. 다음 건물 확장 요청부터 한 번에 대기열에 추가하는 단계 수가 늘어납니다."
OGAS_building_unit_sub: "회당 건설 수 -1 @arrow_down!"
OGAS_building_unit_sub_desc: "\n\n추가 설명\n누르면 회당 건설 수가 1 감소합니다. 최소값은 1입니다."
OGAS_building_queue_add: "건설 대기열 목표 기간 +0.5주 @arrow_up!"
OGAS_building_queue_add_desc: "OGAS가 건설 대기열을 충분히 채우지 못하면 목표 기간을 늘려 보십시오.\n\n추가 설명\n누르면 목표 기간이 0.5주 늘어납니다. 자동 건설은 이 기간을 기준으로 건설 대기열을 더 채웁니다."
OGAS_building_queue_sub: "건설 대기열 목표 기간 -0.5주 @arrow_down!"
OGAS_building_queue_sub_desc: "OGAS가 추가하는 건설 대기열이 너무 길면 목표 기간을 줄이십시오. 경제 상황의 변화에 더 빠르게 대응할 수 있습니다.\n\n추가 설명\n누르면 목표 기간이 0.5주 줄어듭니다. 스크립트에는 하한 제한이 없어 0 이하로도 내려갈 수 있으며, 이 경우 대기열 기간이 목표보다 짧아야 한다는 자동 건설 조건을 충족하기 어려워집니다."


je_cnm_construct_manager_reason: "건설력 단가\n건설력 1점당 비용입니다. 현재 비율에 따라 오차가 있을 수 있으며, 건설력이 많을수록 오차가 줄어듭니다.\n대기열당 비용\n건설 대기열 하나당 비용이며, 대기열이 많을수록 오차가 줄어듭니다.\n건설 총비용\n건설 부문이 사용하는 상품 비용과 임금을 합한 값입니다.\n\nOGAS는 이미 존재하는 건물만 확장할 수 있습니다. 아직 건설되지 않은 건물의 수익성은 계산할 수 없습니다.\nOGAS가 건설하지 않으면 건물의 제한 조건이 너무 많은지 확인하십시오. '$construct_manager$' 버튼이 작동하면 OGAS도 작동하고 있는 것입니다.\n기본적으로 한 번에 건물 1단계를 확장하며, 고용률이 95%를 초과하고 사용자가 설정한 조건을 충족해야 합니다.\n\nOGAS 알림은 설정에서 끌 수 있습니다.\n\n추가 설명\n실제 확장 조건은 고용률 95% 이상이며, 이미 확장 공사가 진행 중인 건물은 제외됩니다. 회당 건설 수와 대기열 목표 기간은 아래 버튼으로 조절할 수 있습니다. 건물 선택에는 건물별 가중치와 건설 비용도 반영됩니다."
