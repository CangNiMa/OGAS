l_korean:

je_cnm_pm_manager: "OGAS 생산 방식 자동 조절"
cnm_pm_manager_status_desc: "$cnm_pm_manager_status_desc_tolerance_pm_manager$\n$cnm_pm_manager_status_desc_pm_manage_frequency$"
cnm_pm_manager_status_desc_tolerance_pm_manager: "$concept_production_method$ 조절 모드 [AddTextIf(EqualTo_CFixedPoint(Scope.GetCountry.MakeScope.Var('cnm_upgrade_tolerance_pm_manager').GetValue,Scope.GetCountry.MakeScope.ScriptValue('pm_upgrade_tolerance_low')), '$MUSIC_PLAYER_DENSITY_INTENSE$')][AddTextIf(EqualTo_CFixedPoint(Scope.GetCountry.MakeScope.Var('cnm_upgrade_tolerance_pm_manager').GetValue,Scope.GetCountry.MakeScope.ScriptValue('pm_upgrade_tolerance_medium')), '$MUSIC_PLAYER_DENSITY_BALANCED$')][AddTextIf(EqualTo_CFixedPoint(Scope.GetCountry.MakeScope.Var('cnm_upgrade_tolerance_pm_manager').GetValue,Scope.GetCountry.MakeScope.ScriptValue('pm_upgrade_tolerance_high')), '$MUSIC_PLAYER_DENSITY_RELAXED$')]"
cnm_pm_manager_status_desc_pm_manage_frequency: "자동 조절 주기 [AddTextIf(EqualTo_CFixedPoint(Scope.GetCountry.MakeScope.Var('cnm_pm_manage_frequency').GetValue,'(CFixedPoint)0'), '꺼짐')][AddTextIf(EqualTo_CFixedPoint(Scope.GetCountry.MakeScope.Var('cnm_pm_manage_frequency').GetValue,'(CFixedPoint)1'), '매주')][AddTextIf(EqualTo_CFixedPoint(Scope.GetCountry.MakeScope.Var('cnm_pm_manage_frequency').GetValue,'(CFixedPoint)2'), '매월')][AddTextIf(EqualTo_CFixedPoint(Scope.GetCountry.MakeScope.Var('cnm_pm_manage_frequency').GetValue,'(CFixedPoint)3'), '매년')] · [Scope.GetCountry.MakeScope.Var('cnm_pm_manage_amount').GetValue]회"
active_upgrade_pm_manager: "[SelectLocalization( EqualTo_CFixedPoint( Scope.GetCountry.MakeScope.Var('cnm_upgrade_pm_manager').GetValue,'(CFixedPoint)0'), '@simple_box!', '@green_checkmark_box!')]기본 생산 방식 자동 개선"
active_upgrade_pm_manager_desc: "예상 수익이 더 높으면 OGAS가 기본 생산 방식을 자동으로 개선하여 생산 효율을 높입니다.\n\n추가 설명\n누르면 기본 생산 방식의 자동 개선을 켜거나 끕니다. 활성화하면 설정된 조절 주기에 맞춰 사용 가능한 상위 생산 방식과 예상 수익을 비교합니다."
active_balance_pm_manager: "[AddTextIf(EqualTo_CFixedPoint(Scope.GetCountry.MakeScope.Var('cnm_balance_pm_manager').GetValue,'(CFixedPoint)0'), '@simple_box!')][AddTextIf(EqualTo_CFixedPoint(Scope.GetCountry.MakeScope.Var('cnm_balance_pm_manager').GetValue,'(CFixedPoint)1'), '@green_checkmark_box!')]생산 방식 자동 균형 조절"
active_balance_pm_manager_desc: "OGAS가 생산 방식의 균형을 자동으로 조절합니다. 예상 수익이 더 높으면 생산 방식을 전환하여 생산을 조절합니다.\n\n추가 설명\n누르면 생산 방식의 자동 균형 조절을 켜거나 끕니다. 활성화하면 설정된 주기와 수익 우위 기준에 따라 생산 방식 전환을 시도합니다."
balance_tolerance_pm_manager_switch: "생산 방식 균형 조절 모드 변경"
balance_tolerance_pm_manager_switch_desc: "생산 방식 균형 조절 기준을 선택합니다.\n$MUSIC_PLAYER_DENSITY_INTENSE$ — 예상 수익이 20% 더 높으면 전환합니다.\n$MUSIC_PLAYER_DENSITY_BALANCED$ — 예상 수익이 35% 더 높으면 전환합니다.\n$MUSIC_PLAYER_DENSITY_RELAXED$ — 예상 수익이 50% 더 높으면 전환합니다.\n\n추가 설명\n누를 때마다 편안함 (1.50) → 격렬함 (1.20) → 균형 (1.35) → 편안함 (1.50) 순으로 바뀝니다. 배율이 높을수록 전환에 요구되는 예상 수익 우위가 커집니다."


pm_manage_amount_add: "회당 조절 횟수 +1"
pm_manage_amount_sub: "회당 조절 횟수 -1"
pm_manage_amount_add_desc: "$pm_manage_amount_add$\n\n추가 설명\n누르면 조절 횟수 설정값이 1 증가합니다. 이 값은 각 생산 방식 전환 규칙이 한 번에 처리할 주 수의 상한으로 사용됩니다."
pm_manage_amount_sub_desc: "$pm_manage_amount_sub$\n\n추가 설명\n누르면 조절 횟수 설정값이 1 감소합니다. 최소값은 1입니다. 각 생산 방식 전환 규칙이 한 번에 처리할 주 수의 상한이 줄어듭니다."
active_workforce_employment_pm_manager: "[SelectLocalization( EqualTo_CFixedPoint(Scope.GetCountry.MakeScope.Var('cnm_workforce_employment_pm_manager').GetValue,'(CFixedPoint)0'), '@simple_box!', '@green_checkmark_box!')]노동력 자동 조절"
active_workforce_employment_pm_manager_desc: "노동력이 5,000명 미만이면 자동화 생산 방식을 개선하여 가용 노동력을 늘리고, 실업률이 10%를 초과하면 자동화 수준을 낮춥니다.\n\n추가 설명\n누르면 노동력에 따른 자동화 조절을 켜거나 끕니다. 실제 강화 조건은 가용 노동력 5,000명 미만이면서 실업률 1% 미만입니다. 완화 조건은 실업자 50,000명 초과이면서 실업률 10% 초과입니다. 활성화하면 설정된 조절 주기에 맞춰 조건을 충족하는 주에 적용됩니다."
pm_manage_frequency_switch: "자동 조절 주기 변경"
pm_manage_frequency_switch_desc: "자동 조절 주기를 매주, 매월, 매년 단위로 변경합니다.\n\n추가 설명\n누를 때마다 꺼짐 → 매주 → 매월 → 매년 → 꺼짐 순으로 바뀝니다. 꺼짐 단계에서는 해당 일지의 정기 생산 방식 조절 실행이 중단됩니다."

reset_pm_manager: "$OPTION_DEFAULT$"
reset_pm_manager_desc: "$OPTION_DEFAULT$\n\n추가 설명\n누르면 노동력에 따른 자동화 조절을 켜고, 조절 횟수는 1, 조절 주기는 매월로 되돌립니다. 기본 생산 방식 개선과 균형 조절은 끄고, 수익 우위 기준은 편안함 (1.50)으로 되돌립니다."

je_cnm_pm_manager_reason: "OGAS의 생산 방식 자동 조절 기능을 설정할 수 있습니다."
